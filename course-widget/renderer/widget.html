<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>桌面课表</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; }
body { font-family: "Microsoft YaHei", system-ui, sans-serif; color: #eef1f8; font-size: 12px; user-select: none; }
#widget { position: relative; background: rgba(16, 20, 36, var(--widget-alpha, 0.66)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.13); border-radius: 14px; padding: 8px 10px 10px; margin: 2px; overflow: hidden; }

.head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; padding: 0 2px; }
.head .range { font-weight: 700; font-size: 13px; white-space: nowrap; }
.head .summary { color: #aab2c8; font-size: 11px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .ic { background: none; border: none; color: #aab2c8; font-size: 13px; cursor: pointer; padding: 2px 6px; border-radius: 6px; flex: 0 0 auto; }
.head .ic:hover { background: rgba(255,255,255,0.12); color: #fff; }
.mv { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.10); color: #aab2c8; font-size: 11px; line-height: 1; cursor: grab; padding: 3px 7px; border-radius: 6px; flex: 0 0 auto; }
.mv:hover { background: rgba(255,255,255,0.14); color: #fff; }
.mv:active { cursor: grabbing; }
.weekrow { margin-top: 6px; }
.weeklabel { font-size: 10px; color: #7d86a3; margin-bottom: 3px; padding-left: 2px; }
.weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { position: relative; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 4px 3px; min-width: 0; }
.day.today { background: rgba(64,128,255,0.28); border-color: rgba(120,170,255,0.6); }
.day .dhead { text-align: center; padding-bottom: 3px; margin-bottom: 3px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.day .dhead .dw { font-size: 10px; color: #9fb0d6; display: block; }
.day .dhead .dn { font-size: 15px; font-weight: 700; line-height: 1.1; }
.day.today .dhead .dn { color: #8fc1ff; }
.add { position: absolute; top: 2px; right: 2px; z-index: 5; width: 16px; height: 16px; line-height: 14px; text-align: center; padding: 0; border: none; border-radius: 4px; background: rgba(255,255,255,0.07); color: #9fb0d6; font-size: 13px; cursor: pointer; }
.add:hover { background: rgba(120,170,255,0.35); color: #fff; }
.ditems { display: flex; flex-direction: column; gap: 2px; }
.it { padding: 1px 2px; border-radius: 4px; font-size: 11px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it .loc { display: block; margin-top: 1px; font-size: 10px; line-height: 1.25; opacity: 0.8; white-space: normal; overflow: visible; }
.it .tm { opacity: 0.75; margin-right: 2px; }
.it.course { color: #e8ecf6; }
.it.todo { color: #ffd76a; }
.it.event { color: #ff8a80; }
.it.done { text-decoration: line-through; opacity: 0.5; }
.empty { color: #66708a; text-align: center; padding: 4px 0; font-size: 10px; }
.hint { margin-top: 6px; color: #7d86a3; font-size: 10px; text-align: center; }
.status { font-size: 11px; color: #9fd0a0; margin: 0 2px 6px; padding: 0 2px; min-height: 14px; }
.cdstrip { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 2px 8px; padding: 4px 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; }
.cd { font-size: 11px; color: #ffd76a; }
.it.course { border-left: 3px solid rgba(255,255,255,0.16); }
.it.now { outline: 1.5px solid #8fc1ff; outline-offset: -1px; background: rgba(80,140,255,0.18); }
.rz { position: absolute; z-index: 50; }
/* 手柄完全放在窗口内容内部（#widget 有 2px margin），避免被窗口裁掉导致只有 3~4px 可点 */
.rz-t { top: 0; left: 18px; right: 18px; height: 7px; cursor: ns-resize; }
.rz-b { bottom: 0; left: 18px; right: 18px; height: 7px; cursor: ns-resize; }
.rz-l { left: 0; top: 18px; bottom: 18px; width: 7px; cursor: ew-resize; }
.rz-r { right: 0; top: 18px; bottom: 18px; width: 7px; cursor: ew-resize; }
.rz-tl { top: 0; left: 0; width: 20px; height: 20px; cursor: nwse-resize; }
.rz-tr { top: 0; right: 0; width: 20px; height: 20px; cursor: nesw-resize; }
.rz-bl { bottom: 0; left: 0; width: 20px; height: 20px; cursor: nesw-resize; }
.rz-br { bottom: 0; right: 0; width: 20px; height: 20px; cursor: nwse-resize; }
</style>
</head>
<body>
<div id="widget">
  <div class="head">
    <button class="mv" id="btnMove" title="按住拖动移动挂件">⠿</button>
    <span class="range" id="range"></span>
    <span class="summary" id="summary"></span>
    <button class="ic" id="btnHide" title="隐藏挂件（托盘可恢复）">✕</button>
    <button class="ic" id="btnGear" title="打开设置">⚙</button>
  </div>
  <div class="status" id="status"></div>
  <div class="cdstrip" id="cdstrip"></div>
  <div class="weekrow">
    <div class="weeklabel" id="label1">本周</div>
    <div class="weekdays" id="week1"></div>
  </div>
  <div class="weekrow">
    <div class="weeklabel" id="label2">下周</div>
    <div class="weekdays" id="week2"></div>
  </div>
  <div class="hint">点日期右上角 + 查看/添加 · 空白处穿透不挡图标 · 左上角 ⠿ 拖动 · 四边缩放</div>
  <div class="rz rz-t" data-edge="t"></div>
  <div class="rz rz-b" data-edge="b"></div>
  <div class="rz rz-l" data-edge="l"></div>
  <div class="rz rz-r" data-edge="r"></div>
  <div class="rz rz-tl" data-edge="tl"></div>
  <div class="rz rz-tr" data-edge="tr"></div>
  <div class="rz rz-bl" data-edge="bl"></div>
  <div class="rz rz-br" data-edge="br"></div>
</div>
<script src="chime.js"></script>
<script src="widget.js"></script>
</body>
</html>
